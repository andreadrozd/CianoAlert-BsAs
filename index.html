<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visor de Alertas - SRH y ADA</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f5f5f5;
            overflow: hidden;
        }
        .container {
            display: grid;
            grid-template-columns: 1fr 280px;
            grid-template-rows: 55% 45%;
            height: 100vh;
            gap: 0;
        }
        /* RESPONSIVO: CELULAR */
        @media (max-width: 768px) {
            body {
                overflow: auto !important;
            }
            .container {
                grid-template-columns: 1fr;
                grid-template-rows: auto 1fr auto;
                gap: 0;
                height: auto !important;
                min-height: 100vh;
            }
            #mapContainer {
                height: 50vh !important;
                position: relative !important;
                top: auto !important;
                right: auto !important;
                bottom: auto !important;
                left: auto !important;
                order: 2;
            }
            #chartContainer {
                height: auto !important;
                position: relative !important;
                bottom: auto !important;
                right: auto !important;
                left: auto !important;
                order: 3;
                min-height: auto;
                overflow: visible !important;
            }
            #chartContentWrapper {
                overflow: visible !important;
                height: auto !important;
                max-height: none !important;
            }
            #rightPanel {
                position: relative !important;
                top: auto !important;
                right: auto !important;
                width: 100% !important;
                height: auto !important;
                bottom: auto !important;
                border-left: none !important;
                border-bottom: 2px solid #ddd;
                max-height: 250px;
                order: 1;
            }
            #chartAndDashboard {
                flex-direction: column !important;
                height: auto !important;
            }
            #pieChart {
                flex: 0 0 200px !important;
                min-width: 100% !important;
            }
            #dashboardContainer {
                grid-template-columns: 1fr !important;
                padding-right: 0 !important;
            }
        }
        /* RESPONSIVO: TABLETA */
        @media (max-width: 1024px) and (min-width: 769px) {
            .container {
                grid-template-columns: 1fr 250px;
            }
            #rightPanel {
                width: 250px !important;
            }
        }
        /* COMPUTADORA */
        @media (min-width: 1025px) {
            .container {
                grid-template-columns: 1fr 280px;
            }
        }
        #mapContainer {
            position: absolute;
            top: 0;
            left: 0;
            right: 280px;
            bottom: 45%;
            z-index: 1;
        }
        #chartContainer {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 280px;
            height: 45%;
            background: #ecf0f1;
            border-top: 2px solid #ddd;
            padding: 0;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            z-index: 1;
        }
        #chartContainerHeader {
            background: #34495e;
            color: white;
            padding: 10px 15px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: 600;
            user-select: none;
            font-size: 16px;
        }
        #chartContainerHeader:hover {
            background: #2c3e50;
        }
        #chartContentWrapper {
            flex: 1;
            overflow: auto;
            padding: 15px;
        }
        #chartContentWrapper.hidden {
            display: none;
        }
        #chartAndDashboard {
            display: flex;
            gap: 20px;
            width: 100%;
            height: 100%;
        }
        #pieChart {
            flex: 0 0 50%;
            min-width: 350px;
        }
        #dashboardContainer {
            flex: 1;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            padding-right: 10px;
        }
        .scorecard {
            color: white;
            padding: 12px;
            border-radius: 8px;
            text-align: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            font-size: 13px;
            transition: transform 0.2s;
        }
        .scorecard:hover {
            transform: translateY(-2px);
        }
        .scorecard.red {
            background: #c31000;
        }
        .scorecard.orange {
            background: #f6683b;
        }
        .scorecard.yellow-dark {
            background: #f6fc3b;
            color: #000;
        }
        .scorecard.yellow {
            background: #f1c40f;
            color: #333;
        }
        .scorecard.yellow-light {
            background: #fff9c4;
            color: #333;
        }
        .scorecard.green-dark {
            background: #248c2b;
        }
        .scorecard.green {
            background: #52be80;
        }
        .scorecard.blue-pastel {
            background: #aed6f1;
            color: #1a3a5c;
        }
        .scorecard-title {
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 6px;
            opacity: 0.95;
        }
        .scorecard-value {
            font-size: 26px;
            font-weight: bold;
        }
        .scorecard-subtitle {
            font-size: 12px;
            opacity: 0.8;
            margin-top: 4px;
            font-weight: 500;
        }
        #rightPanel {
            position: absolute;
            top: 0;
            right: 0;
            width: 280px;
            bottom: 0;
            background: white;
            border-left: 2px solid #ddd;
            padding: 15px;
            overflow-y: auto;
            z-index: 2;
        }
        .panel-title {
            font-size: 19px;
            font-weight: bold;
            color: #333;
            background: #2c3e50;
            color: white;
            padding: 10px;
            margin: -15px -15px 15px -15px;
            text-align: center;
            border-radius: 4px 4px 0 0;
        }
        .collapsible-section {
            margin-bottom: 20px;
        }
        .section-header {
            background: #34495e;
            color: white;
            padding: 10px;
            border-radius: 4px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: 600;
            user-select: none;
            font-size: 15px;
        }
        .section-header:hover {
            background: #2c3e50;
        }
        .section-content {
            background: #ecf0f1;
            padding: 10px;
            border-radius: 0 0 4px 4px;
            max-height: 500px;
            overflow-y: auto;
            transition: all 0.3s ease;
        }
        .section-content.hidden {
            max-height: 0;
            overflow: hidden;
            padding: 0;
        }
        .toggle-btn {
            font-size: 18px;
            cursor: pointer;
        }
        .legend-item {
            margin-bottom: 8px;
            font-size: 14px;
        }
        .legend-color {
            display: inline-block;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            margin-right: 6px;
            vertical-align: middle;
        }
        .checkbox-group {
            margin-bottom: 10px;
        }
        .checkbox-group label {
            display: flex;
            align-items: center;
            font-size: 15px;
            cursor: pointer;
        }
        .checkbox-group input {
            margin-right: 8px;
            cursor: pointer;
        }
        .layer-stats {
            font-size: 14px;
            margin-top: 8px;
            padding: 8px;
            background: white;
            border-radius: 4px;
            border-left: 3px solid #34495e;
        }
        /* Controles personalizados: geolocalizador y busqueda de sitios */
        .custom-ctrl a {
            font-size: 18px;
            font-weight: bold;
            line-height: 30px;
            text-align: center;
            display: block;
        }
        .site-search-ctrl {
            width: 260px;
            max-width: 72vw;
        }
        .ss-box {
            display: flex;
            background: #fff;
            border: 2px solid #34495e;
            border-radius: 6px;
            overflow: hidden;
            box-shadow: 0 1px 6px rgba(0,0,0,0.3);
        }
        .ss-box input {
            flex: 1;
            border: none;
            padding: 8px 10px;
            font-size: 15px;
            outline: none;
            min-width: 0;
        }
        .ss-box button {
            border: none;
            background: #34495e;
            color: #fff;
            cursor: pointer;
            padding: 0 12px;
            font-size: 16px;
        }
        .ss-box button:hover { background: #2c3e50; }
        .ss-results {
            margin-top: 4px;
            background: #fff;
            border-radius: 6px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.25);
            max-height: 260px;
            overflow-y: auto;
            display: none;
        }
        .ss-results .ss-header {
            background: #2c3e50;
            color: #fff;
            font-size: 13px;
            font-weight: 700;
            padding: 5px 10px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            position: sticky;
            top: 0;
        }
        .ss-item {
            padding: 7px 10px;
            font-size: 14px;
            cursor: pointer;
            border-bottom: 1px solid #eee;
            line-height: 1.3;
        }
        .ss-item:hover { background: #ecf0f1; }
        .ss-item .ss-sub { font-size: 13px; color: #666; }
        .ss-item .ss-badge {
            display: inline-block;
            font-size: 12px;
            font-weight: 700;
            color: #fff;
            border-radius: 3px;
            padding: 1px 6px;
            margin-right: 6px;
            vertical-align: middle;
        }
        .ss-empty { padding: 8px 10px; font-size: 14px; color: #888; }
    </style>
</head>
<body>
    <div id="mapContainer"></div>
    <div id="chartContainer">
        <div id="chartContainerHeader" onclick="toggleChartPanel()">
            <span><b>Distribución de Alertas</b></span>
            <span class="toggle-btn">−</span>
        </div>
        <div id="chartContentWrapper">
            <div id="chartAndDashboard">
                <div id="pieChart"></div>
                <div id="dashboardContainer"></div>
            </div>
        </div>
    </div>
    <div id="rightPanel">
        <div class="panel-title">Alertas 2026-05-06</div>
        
        <!-- Capas Activas -->
        <div class="collapsible-section">
            <div class="section-header" onclick="toggleSection(this)">
                <span>Capas activas</span>
                <span class="toggle-btn">−</span>
            </div>
            <div class="section-content">
                <div class="checkbox-group">
                    <label>
                        <input type="checkbox" id="srh-toggle" checked onchange="updateMap()">
                        SRH
                    </label>
                </div>
                <div id="srh-stats" class="layer-stats">Puntos: 0</div>
                <div class="checkbox-group">
                    <label>
                        <input type="checkbox" id="ada-toggle" checked onchange="updateMap()">
                        ADA
                    </label>
                </div>
                <div id="ada-stats" class="layer-stats">Puntos: 0</div>
            </div>
        </div>
        
        <!-- Leyenda -->
        <div class="collapsible-section">
            <div class="section-header" onclick="toggleSection(this)">
                <span>Leyenda</span>
                <span class="toggle-btn">−</span>
            </div>
            <div class="section-content">
                <div><strong>Nivel de alerta</strong></div>
                <div class="legend-item"><svg viewBox="0 0 30 30" width="18" height="18" style="vertical-align:middle;margin-right:8px;"><circle cx="15" cy="15" r="11" fill="#248c2b"/></svg>Alerta 1 (Verde)</div>
                <div class="legend-item"><svg viewBox="0 0 30 30" width="18" height="18" style="vertical-align:middle;margin-right:8px;"><circle cx="15" cy="15" r="11" fill="#f6fc3b"/><text x="15" y="20.5" text-anchor="middle" font-size="15" font-weight="bold" font-family="Arial, sans-serif" fill="#222222">!</text></svg>Alerta 2 (Amarillo)</div>
                <div class="legend-item"><svg viewBox="0 0 30 30" width="18" height="18" style="vertical-align:middle;margin-right:8px;"><circle cx="15" cy="15" r="11" fill="#f6683b"/><path d="M15 8.5 V21.5 M8.5 15 H21.5" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/></svg>Alerta 3 (Naranja)</div>
                <div class="legend-item"><svg viewBox="0 0 30 30" width="18" height="18" style="vertical-align:middle;margin-right:8px;"><circle cx="15" cy="15" r="11" fill="#c31000"/><path d="M15 8.5 V21.5 M8.5 15 H21.5" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/></svg>Alerta 4 (Rojo)</div>
                <div style="margin-top: 14px;"><strong>Tendencias</strong></div>
                <div class="legend-item"><svg viewBox="0 0 30 30" width="18" height="18" style="vertical-align:middle;margin-right:8px;"><circle cx="15" cy="15" r="11" fill="#7f8c8d"/></svg>Estable</div>
                <div class="legend-item"><svg viewBox="0 0 30 30" width="18" height="18" style="vertical-align:middle;margin-right:8px;"><path d="M15 3 L24 15 L18 15 L18 27 L12 27 L12 15 L6 15 Z" fill="#7f8c8d"/></svg>En aumento</div>
                <div class="legend-item"><svg viewBox="0 0 30 30" width="18" height="18" style="vertical-align:middle;margin-right:8px;"><path d="M15 27 L24 15 L18 15 L18 3 L12 3 L12 15 L6 15 Z" fill="#7f8c8d"/></svg>En disminución</div>
                <div style="margin-top: 6px; font-size: 13px; color: #666;">El color y el símbolo indican el nivel de alerta.</div>
            </div>
        </div>
    </div>

    <script>
        // Initialize map
        const map = L.map('mapContainer').setView([-36.423795, -60.490621], 6);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap contributors',
            maxZoom: 19
        }).addTo(map);

        let geoJsonLayers = {};
        const layerNames = ['mi-capa', 'mi-capa-ada'];
        const layerDisplayNames = { 'mi-capa': 'SRH', 'mi-capa-ada': 'ADA' };
        const layerToggles = { 'mi-capa': 'srh-toggle', 'mi-capa-ada': 'ada-toggle' };
        const layerStats = { 'mi-capa': 'srh-stats', 'mi-capa-ada': 'ada-stats' };

        // Fields to display for each layer
        const layerFields = {
            'mi-capa': ['MUNICIPIO', 'PUNTO', 'S2 Fecha', 'S3 Fecha', 'info', 'Acciones'],
            'mi-capa-ada': ['Nombre', 'Laguna', 'S2 Fecha', 'S3 Fecha', 'info', 'Acciones']
        };

        // Color mapping for alerts
        const alertColors = {
            1: '#248c2b',
            2: '#f6fc3b',
            3: '#f6683b',
            4: '#c31000'
        };

        // Devuelve el SVG del marcador segun nivel de alerta (color) y variacion (Dif)
        function getMarkerSvg(alerta, dif, color) {
            const stroke = '#ffffff';
            const open = '<svg viewBox="0 0 30 30" width="30" height="30">';
            const close = '</svg>';

            // En aumento -> flecha hacia arriba, con el color del nivel
            if (dif === 1) {
                return open +
                    '<path d="M15 3 L24 15 L18 15 L18 27 L12 27 L12 15 L6 15 Z" fill="' + color + '"/>' +
                    close;
            }
            // En disminucion -> flecha hacia abajo, con el color del nivel
            if (dif === -1) {
                return open +
                    '<path d="M15 27 L24 15 L18 15 L18 3 L12 3 L12 15 L6 15 Z" fill="' + color + '"/>' +
                    close;
            }

            // Estable (dif === 0) -> circulo + simbolo segun nivel
            let inner = '';
            if (alerta === 4 || alerta === 3) {
                // Rojo / Naranja: cruz blanca en el medio
                inner = '<path d="M15 8.5 V21.5 M8.5 15 H21.5" stroke="' + stroke + '" stroke-width="3" stroke-linecap="round"/>';
            } else if (alerta === 2) {
                // Amarillo: signo de admiracion
                inner = '<text x="15" y="20.5" text-anchor="middle" font-size="15" font-weight="bold" font-family="Arial, sans-serif" fill="#222222">!</text>';
            }
            // Verde (alerta 1): solo el circulo, sin simbolo
            return open +
                '<circle cx="15" cy="15" r="11" fill="' + color + '"/>' +
                inner +
                close;
        }

        function createMarker(feature, latlng, layerName) {
            const alerta = feature.properties.Alerta || 1;
            const dif = feature.properties.Dif || 0;
            const color = alertColors[alerta] || '#248c2b';
            const html = `
                <div style="cursor: pointer; line-height: 0; filter: drop-shadow(0 0 2px rgba(255,255,255,0.95));">${getMarkerSvg(alerta, dif, color)}</div>
            `;

            const marker = L.marker(latlng, {
                icon: L.divIcon({
                    html: html,
                    iconSize: [30, 30],
                    className: ''
                })
            });

            // Popup with specific fields
            const fields = layerFields[layerName];
            const layerLabel = layerDisplayNames[layerName];

            // Nombre del punto: para SRH es PUNTO, para ADA es Nombre
            const pointNameField = layerName === 'mi-capa' ? 'PUNTO' : 'Nombre';
            const pointName = feature.properties[pointNameField] || '-';

            let popupContent = `
                <div style="font-size: 15px; min-width: 200px;">
                    <div style="
                        text-align: center;
                        font-size: 20px;
                        font-weight: 800;
                        letter-spacing: 2px;
                        color: #2c3e50;
                        background: #ecf0f1;
                        border-radius: 6px 6px 0 0;
                        padding: 6px 10px 2px;
                        margin-bottom: 2px;
                        text-transform: uppercase;
                    ">${layerLabel}</div>
                    <div style="
                        text-align: center;
                        font-size: 17px;
                        font-weight: 700;
                        color: #1a5276;
                        background: #e8f4fc;
                        border-radius: 0;
                        padding: 4px 10px 8px;
                        margin-bottom: 8px;
                        border-bottom: 2px solid #e0e0e0;
                    ">${pointName}</div>
            `;
            fields.forEach(field => {
                if (field === pointNameField) return;
                let value = feature.properties[field] || '-';

                if (field === 'info' && value !== '-') {
                    const alertStyles = {
                        'alerta verde':    { bg: '#1e7e34', color: '#ffffff' },
                        'alerta amarillo': { bg: '#d4a017', color: '#ffffff' },
                        'alerta naranja':  { bg: '#d35400', color: '#ffffff' },
                        'alerta roja':     { bg: '#c0392b', color: '#ffffff' }
                    };
                    const commaIdx = value.indexOf(',');
                    let prefix = commaIdx !== -1 ? value.substring(0, commaIdx) : value;
                    let rest   = commaIdx !== -1 ? value.substring(commaIdx) : '';
                    const prefixLower = prefix.toLowerCase().trim();
                    let matched = null;
                    for (const key of Object.keys(alertStyles)) {
                        if (prefixLower.includes(key)) { matched = key; break; }
                    }
                    if (matched) {
                        const s = alertStyles[matched];
                        value = `<span style="display:inline-block;background:${s.bg};color:${s.color};font-weight:700;padding:1px 7px;border-radius:4px;border:1px solid rgba(0,0,0,0.15);">${prefix}</span>${rest}`;
                    }
                }

                if (field === 'Acciones') {
                    popupContent += `<div style="padding: 4px 4px 2px; font-size: 16px;"><strong>${field}:</strong> ${value}</div>`;
                } else {
                    popupContent += `<div style="padding: 2px 4px;"><strong>${field}:</strong> ${value}</div>`;
                }
            });
            popupContent += '</div>';

            marker.bindPopup(popupContent);
            return marker;
        }

        function loadGeoJsonLayer(layerName) {
            return fetch(`${layerName}.geojson`)
                .then(res => res.json())
                .then(data => {
                    const featureGroup = L.featureGroup();
                    const totalPoints = data.features.length;
                    
                    data.features.forEach(feature => {
                        if (feature.geometry && feature.geometry.coordinates) {
                            const latlng = [feature.geometry.coordinates[1], feature.geometry.coordinates[0]];
                            const marker = createMarker(feature, latlng, layerName);
                            featureGroup.addLayer(marker);

                            // Indexar el punto para la busqueda de sitios
                            const layerLabel = layerDisplayNames[layerName];
                            const nameField = layerName === 'mi-capa' ? 'PUNTO' : 'Nombre';
                            const subField  = layerName === 'mi-capa' ? 'MUNICIPIO' : 'Laguna';
                            const name = feature.properties[nameField] || '(sin nombre)';
                            const sub  = feature.properties[subField] || '';
                            searchIndex.push({
                                marker: marker,
                                layerName: layerName,
                                layerLabel: layerLabel,
                                name: name,
                                sub: sub,
                                latlng: latlng,
                                search: (name + ' ' + sub + ' ' + layerLabel).toLowerCase()
                            });
                        }
                    });
                    
                    geoJsonLayers[layerName] = { data: data, featureGroup: featureGroup };
                    featureGroup.addTo(map);
                    
                    // Update stats
                    const statsId = layerStats[layerName];
                    document.getElementById(statsId).innerHTML = `Puntos: ${totalPoints}`;
                })
                .catch(err => {
                    console.warn(`No se pudo cargar ${layerName}.geojson:`, err);
                    const statsId = layerStats[layerName];
                    document.getElementById(statsId).innerHTML = `Puntos: 0 (archivo no encontrado)`;
                });
        }

        function updateMap() {
            // Update layer visibility
            Object.keys(geoJsonLayers).forEach(layerName => {
                const toggleId = layerToggles[layerName];
                const isVisible = document.getElementById(toggleId).checked;
                if (isVisible) {
                    map.addLayer(geoJsonLayers[layerName].featureGroup);
                } else {
                    map.removeLayer(geoJsonLayers[layerName].featureGroup);
                }
            });
            updateChart();
            updateDashboard();
        }

        function getVisibleFeatures() {
            const visibleFeatures = [];
            const bounds = map.getBounds();
            
            Object.keys(geoJsonLayers).forEach(layerName => {
                const toggleId = layerToggles[layerName];
                if (!document.getElementById(toggleId).checked) return;
                
                geoJsonLayers[layerName].data.features.forEach(feature => {
                    if (feature.geometry && feature.geometry.coordinates) {
                        const lat = feature.geometry.coordinates[1];
                        const lng = feature.geometry.coordinates[0];
                        // Verificar si el punto está dentro de los bounds visibles
                        if (bounds.contains(L.latLng(lat, lng))) {
                            visibleFeatures.push({ feature: feature, layer: layerName });
                        }
                    }
                });
            });
            return visibleFeatures;
        }

        function updateChart() {
            const visibleFeatures = getVisibleFeatures();
            const alertCounts = { 1: 0, 2: 0, 3: 0, 4: 0 };
            visibleFeatures.forEach(({ feature }) => {
                const alerta = feature.properties.Alerta || 1;
                alertCounts[alerta]++;
            });

            const labels = ['Alerta 1', 'Alerta 2', 'Alerta 3', 'Alerta 4'];
            const values = [alertCounts[1], alertCounts[2], alertCounts[3], alertCounts[4]];
            const colors = ['#248c2b', '#f6fc3b', '#f6683b', '#c31000'];

            const data = [{
                labels: labels,
                values: values,
                type: 'pie',
                hole: 0.4,
                marker: { colors: colors },
                textposition: 'inside',
                textinfo: 'label+percent'
            }];

            const layout = {
                title: { text: 'Distribución de Alertas', font: { size: 14 } },
                showlegend: false,
                margin: { l: 20, r: 20, t: 40, b: 20 },
                font: { size: 11 }
            };

            Plotly.newPlot('pieChart', data, layout, { responsive: true });
        }

        function updateDashboard() {
            const visibleFeatures = getVisibleFeatures();
            
            // Contadores por nivel de alerta y variación
            const alertCounts = {
                1: { stable: 0, increase: 0, decrease: 0, total: 0 },
                2: { stable: 0, increase: 0, decrease: 0, total: 0 },
                3: { stable: 0, increase: 0, decrease: 0, total: 0 },
                4: { stable: 0, increase: 0, decrease: 0, total: 0 }
            };

            visibleFeatures.forEach(({ feature }) => {
                const alerta = feature.properties.Alerta || 1;
                const dif = feature.properties.Dif || 0;
                
                // Actualizar contadores detallados por alerta
                alertCounts[alerta].total++;
                if (dif === 0) alertCounts[alerta].stable++;
                if (dif === 1) alertCounts[alerta].increase++;
                if (dif === -1) alertCounts[alerta].decrease++;
            });

            const scorecards = [
                { title: 'Alerta 4 (Rojo)', value: alertCounts[4].total, class: 'red', subtitle: `Est: ${alertCounts[4].stable} | ↑: ${alertCounts[4].increase} | ↓: ${alertCounts[4].decrease}` },
                { title: 'Alerta 3 (Naranja)', value: alertCounts[3].total, class: 'orange', subtitle: `Est: ${alertCounts[3].stable} | ↑: ${alertCounts[3].increase} | ↓: ${alertCounts[3].decrease}` },
                { title: 'Alerta 2 (Amarillo)', value: alertCounts[2].total, class: 'yellow-dark', subtitle: `Est: ${alertCounts[2].stable} | ↑: ${alertCounts[2].increase} | ↓: ${alertCounts[2].decrease}` },
                { title: 'Alerta 1 (Verde)', value: alertCounts[1].total, class: 'green-dark', subtitle: `Est: ${alertCounts[1].stable} | ↑: ${alertCounts[1].increase} | ↓: ${alertCounts[1].decrease}` },
                { title: 'Total puntos visibles', value: visibleFeatures.length, class: 'blue-pastel' }
            ];

            const dashboardHtml = scorecards.map(card => `
                <div class="scorecard ${card.class}">
                    <div class="scorecard-title">${card.title}</div>
                    <div class="scorecard-value">${card.value}</div>
                    ${card.subtitle ? `<div class="scorecard-subtitle">${card.subtitle}</div>` : ''}
                </div>
            `).join('');

            document.getElementById('dashboardContainer').innerHTML = dashboardHtml;
        }

        function toggleSection(header) {
            const content = header.nextElementSibling;
            const toggle = header.querySelector('.toggle-btn');
            content.classList.toggle('hidden');
            toggle.textContent = content.classList.contains('hidden') ? '+' : '−';
        }

        function toggleChartPanel() {
            const wrapper = document.getElementById('chartContentWrapper');
            const toggle = document.querySelector('#chartContainerHeader .toggle-btn');
            const container = document.getElementById('chartContainer');
            const mapC = document.getElementById('mapContainer');
            wrapper.classList.toggle('hidden');
            const minimized = wrapper.classList.contains('hidden');
            toggle.textContent = minimized ? '+' : '−';

            // En desktop: al minimizar, el mapa ocupa el area liberada
            if (window.matchMedia('(min-width: 769px)').matches) {
                if (minimized) {
                    const h = document.getElementById('chartContainerHeader').offsetHeight;
                    container.style.height = h + 'px';
                    mapC.style.bottom = h + 'px';
                } else {
                    container.style.height = '';
                    mapC.style.bottom = '';
                }
            }
            setTimeout(function () { map.invalidateSize(); }, 220);
        }

        // ============================================================
        //  HERRAMIENTAS: 1) Geolocalizador  2) Busqueda de sitios (OSM)
        // ============================================================
        let searchIndex = [];
        let userMarker = null;
        let userCircle = null;
        let osmSearchTimer = null;
        let osmResultMarker = null;

        // ---- 1) Geolocalizador ----
        const geoCtrl = L.control({ position: 'topleft' });
        geoCtrl.onAdd = function () {
            const c = L.DomUtil.create('div', 'leaflet-bar custom-ctrl');
            c.innerHTML = '<a href="#" title="Ir a mi ubicacion" role="button">&#128205;</a>';
            L.DomEvent.disableClickPropagation(c);
            L.DomEvent.on(c.querySelector('a'), 'click', function (e) {
                L.DomEvent.stop(e);
                locateUser();
            });
            return c;
        };
        geoCtrl.addTo(map);

        function locateUser() {
            map.locate({ setView: true, maxZoom: 14, enableHighAccuracy: true });
        }

        map.on('locationfound', function (e) {
            if (userMarker) map.removeLayer(userMarker);
            if (userCircle) map.removeLayer(userCircle);
            userCircle = L.circle(e.latlng, {
                radius: e.accuracy,
                color: '#2c3e50', fillColor: '#3498db', fillOpacity: 0.15, weight: 1
            }).addTo(map);
            userMarker = L.marker(e.latlng, {
                icon: L.divIcon({
                    html: '<div style="font-size:26px; line-height:26px; text-shadow:0 0 3px #fff;">&#128205;</div>',
                    iconSize: [26, 26], iconAnchor: [13, 26], className: ''
                })
            }).addTo(map).bindPopup('Estas aqui (&plusmn;' + Math.round(e.accuracy) + ' m)').openPopup();
        });

        map.on('locationerror', function (e) {
            alert('No se pudo obtener tu ubicacion.\n' + e.message +
                  '\n\n(La geolocalizacion requiere permiso del navegador y, en general, conexion segura HTTPS.)');
        });

        // ---- 2) Busqueda de sitios (capas propias + lugares OSM) ----
        const searchCtrl = L.control({ position: 'topright' });
        searchCtrl.onAdd = function () {
            const c = L.DomUtil.create('div', 'site-search-ctrl');
            c.innerHTML =
                '<div class="ss-box">' +
                '  <input id="siteSearchInput" type="text" placeholder="Buscar sitio o lugar (OSM)..." autocomplete="off">' +
                '  <button id="siteSearchBtn" title="Buscar en OSM">&#128269;</button>' +
                '</div>' +
                '<div id="siteSearchResults" class="ss-results"></div>';
            L.DomEvent.disableClickPropagation(c);
            L.DomEvent.disableScrollPropagation(c);
            return c;
        };
        searchCtrl.addTo(map);

        document.getElementById('siteSearchInput').addEventListener('input', onSearchInput);
        document.getElementById('siteSearchInput').addEventListener('keydown', function (e) {
            if (e.key === 'Enter') { e.preventDefault(); runOsmSearch(this.value.trim()); }
        });
        document.getElementById('siteSearchBtn').addEventListener('click', function () {
            runOsmSearch(document.getElementById('siteSearchInput').value.trim());
        });

        function onSearchInput() {
            const q = document.getElementById('siteSearchInput').value.trim();
            if (!q) { hideResults(); return; }
            const local = searchLocal(q);
            renderResults(local, null);            // resultados de las capas, al instante
            clearTimeout(osmSearchTimer);
            osmSearchTimer = setTimeout(function () { runOsmSearch(q, local); }, 450);
        }

        function searchLocal(q) {
            const ql = q.toLowerCase();
            return searchIndex
                .filter(function (s) { return s.search.indexOf(ql) !== -1; })
                .slice(0, 8);
        }

        function runOsmSearch(q, localCached) {
            if (!q) return;
            const local = localCached || searchLocal(q);
            const url = 'https://nominatim.openstreetmap.org/search?format=json&limit=5&countrycodes=ar&q=' +
                        encodeURIComponent(q);
            fetch(url, { headers: { 'Accept-Language': 'es' } })
                .then(function (r) { return r.json(); })
                .then(function (osm) { renderResults(local, osm); })
                .catch(function () { renderResults(local, []); });
        }

        function renderResults(local, osm) {
            const box = document.getElementById('siteSearchResults');
            let html = '';

            if (local && local.length) {
                html += '<div class="ss-header">Sitios monitoreados</div>';
                local.forEach(function (s, i) {
                    const color = s.layerName === 'mi-capa' ? '#2980b9' : '#16a085';
                    html += '<div class="ss-item" data-type="local" data-idx="' + i + '">' +
                            '<span class="ss-badge" style="background:' + color + '">' + s.layerLabel + '</span>' +
                            s.name +
                            (s.sub ? '<div class="ss-sub">' + s.sub + '</div>' : '') +
                            '</div>';
                });
            }

            if (osm) {
                if (osm.length) {
                    html += '<div class="ss-header">Lugares (OSM)</div>';
                    osm.forEach(function (o, i) {
                        html += '<div class="ss-item" data-type="osm" data-idx="' + i + '">' +
                                '<span class="ss-badge" style="background:#7f8c8d">OSM</span>' +
                                o.display_name +
                                '</div>';
                    });
                } else if (!local || !local.length) {
                    html += '<div class="ss-empty">Sin resultados.</div>';
                }
            } else if (!local || !local.length) {
                html += '<div class="ss-empty">Escribi para buscar...</div>';
            }

            box.innerHTML = html;
            box.style.display = 'block';
            box._local = local || [];
            box._osm = osm || [];

            box.querySelectorAll('.ss-item').forEach(function (el) {
                el.addEventListener('click', function () {
                    const idx = parseInt(el.getAttribute('data-idx'), 10);
                    if (el.getAttribute('data-type') === 'local') {
                        goToLocal(box._local[idx]);
                    } else {
                        goToOsm(box._osm[idx]);
                    }
                    hideResults();
                });
            });
        }

        function hideResults() {
            const box = document.getElementById('siteSearchResults');
            box.style.display = 'none';
            box.innerHTML = '';
        }

        function goToLocal(s) {
            if (!s) return;
            const toggle = document.getElementById(layerToggles[s.layerName]);
            if (toggle && !toggle.checked) { toggle.checked = true; updateMap(); }
            map.flyTo(s.latlng, 13, { duration: 0.8 });
            map.once('moveend', function () { s.marker.openPopup(); });
        }

        function goToOsm(o) {
            if (!o) return;
            const latlng = [parseFloat(o.lat), parseFloat(o.lon)];
            if (osmResultMarker) map.removeLayer(osmResultMarker);
            map.flyTo(latlng, 13, { duration: 0.8 });
            osmResultMarker = L.marker(latlng).addTo(map)
                .bindPopup('<b>' + o.display_name + '</b>').openPopup();
        }

        // Load layers
        Promise.all(layerNames.map(loadGeoJsonLayer)).then(() => {
            updateChart();
            updateDashboard();
            // Actualizar dinámicamente con zoom
            map.on('zoomend', () => {
                updateChart();
                updateDashboard();
            });
            // Actualizar dinámicamente con movimiento
            map.on('moveend', () => {
                updateChart();
                updateDashboard();
            });
        });

        // Resize handler for responsive
        window.addEventListener('resize', () => {
            setTimeout(() => {
                map.invalidateSize();
            }, 100);
        });
    </script>
<script>window.parent.postMessage({ action: "ready" }, "*"); 
 
window.console = new Proxy(console, {
  get(target, prop) {
    if (['log', 'warn', 'error'].includes(prop)) {
      return new Proxy(target[prop], {
        apply(fn, thisArg, args) {
          fn.apply(thisArg, args);
          window.parent.postMessage({ action: 'console', 
            type: prop, 
            args: args.map((arg) => {
              try {
                return JSON.stringify(arg).replace(/^["']|["']$/g, '');
              } catch (e) {
                return arg;
              }
            }) 
          }, '*');
        }
      });
    }
    return target[prop];
  }
});
</script></body>
