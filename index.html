<!DOCTYPE html>
<!-- build 2026-07-02 -->
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visor de Alertas - SRH y ADA</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f5f5f5;
            overflow: hidden;
        }
        .container {
            display: grid;
            grid-template-columns: 1fr 280px;
            grid-template-rows: 55% 45%;
            height: 100vh;
            gap: 0;
        }
        /* RESPONSIVO: CELULAR */
        @media (max-width: 768px) {
            body { overflow: hidden !important; }
            .container { display: block; }

            /* Mapa pantalla completa */
            #mapContainer {
                position: fixed !important;
                top: 0 !important; left: 0 !important; right: 0 !important; bottom: 0 !important;
                width: 100% !important; height: 100% !important;
                z-index: 1;
            }

            /* Panel lateral → drawer desde la derecha */
            #rightPanel {
                position: fixed !important;
                top: 0 !important; right: 0 !important; bottom: 0 !important; left: auto !important;
                width: 80vw !important; height: 100% !important; max-height: 100%;
                border-left: 2px solid #ddd !important;
                border-radius: 0 !important;
                box-shadow: -4px 0 20px rgba(0,0,0,0.25);
                transform: translateX(100%);
                transition: transform 0.3s ease;
                z-index: 20;
                overflow-y: auto !important;
                padding: 12px !important;
                padding-bottom: 30px !important;
            }
            #rightPanel.mobile-open { transform: translateX(0); }

            /* Pestaña lateral siempre visible */
            #mobileDrawerTab {
                display: flex !important;
                right: 0;
                transition: right 0.3s ease;
            }
            #mobileDrawerTab.drawer-open { right: 80vw; }

            /* Ocultar elementos no usados en mobile */
            #mobileInfoBtn { display: none !important; }
            .mobile-panel-handle { display: none !important; }
            #panelTitle { border-radius: 0 !important; }
            #mobileClosePanel { display: block !important; }

            /* Backdrop */
            #mobileBackdrop {
                display: block !important;
                opacity: 0; pointer-events: none;
                transition: opacity 0.3s;
            }
            #mobileBackdrop.open { opacity: 1; pointer-events: auto; }

            /* Bottom sheet del chart */
            #chartContainer {
                position: fixed !important;
                bottom: 0 !important; left: 0 !important; right: 0 !important;
                width: 100% !important; height: 46% !important;
                transform: translateY(100%);
                transition: transform 0.3s ease;
                z-index: 1000 !important;
                border-radius: 14px 14px 0 0;
                box-shadow: 0 -4px 16px rgba(0,0,0,0.2);
            }
            #chartContainer.mobile-open { transform: translateY(0); }
            #chartContainer.mobile-minimized { transform: translateY(calc(100% - 44px)); }

            #chartContentWrapper {
                height: calc(100% - 44px) !important;
                overflow: auto !important;
                max-height: none !important;
            }
            #chartAndDashboard {
                flex-direction: column !important;
                height: 100% !important;
                gap: 8px !important;
            }
            /* Serie temporal: llena todo el alto disponible del bottom sheet */
            #timeSeriesChart { flex: 1 1 auto !important; min-width: 100% !important; min-height: 0 !important; height: 100% !important; }
            /* Distribución: donut arriba (fijo) + tabla abajo, con scroll si hace falta */
            #dashboardContainer { flex: 1 1 auto !important; min-height: 0 !important; padding-right: 0 !important; overflow-y: auto !important; }
            #donutChart { height: 180px !important; flex: 0 0 180px !important; }

            /* ── Tamaños aumentados para baja visión ── */
            #rightPanel { font-size: 16px !important; }
            .panel-title { font-size: 19px !important; padding: 13px 12px !important; }
            .section-header { font-size: 16px !important; padding: 10px 12px !important; }
            .section-header .toggle-btn { font-size: 20px !important; }
            .layer-stats { font-size: 14px !important; }
            .layer-stats .stats-date { font-size: 12px !important; }
            .checkbox-group label { font-size: 16px !important; gap: 10px !important; }
            .checkbox-group input[type="checkbox"] { width: 20px !important; height: 20px !important; }
            .legend-label { font-size: 15px !important; }
            .chart-icon-btn { font-size: 13px !important; padding: 10px 14px !important; min-width: 100px !important; }
            .chart-icon-btn .cib-icon { font-size: 26px !important; }
            #mobileDrawerTab { font-size: 22px !important; width: 28px !important; height: 52px !important; }
            #chartContainerHeader button { width: 36px !important; height: 36px !important; font-size: 20px !important; }
            #chartContainerHeader .toggle-btn { font-size: 24px !important; }
        }
        /* RESPONSIVO: TABLETA */
        @media (max-width: 1024px) and (min-width: 769px) {
            .container {
                grid-template-columns: 1fr 250px;
            }
            #rightPanel {
                width: 250px !important;
            }
        }
        /* COMPUTADORA */
        @media (min-width: 1025px) {
            .container {
                grid-template-columns: 1fr 280px;
            }
        }
        #mapContainer {
            position: absolute;
            top: 0;
            left: 0;
            right: 280px;
            bottom: 38%;
            z-index: 1;
        }
        #chartContainer {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 280px;
            height: 38%;
            background: #ecf0f1;
            border-top: 2px solid #ddd;
            padding: 0;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            z-index: 1;
        }
        #chartContainerHeader {
            background: #34495e;
            color: white;
            padding: 10px 15px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: 600;
            user-select: none;
            font-size: 14px;
        }
        #chartContainerHeader:hover {
            background: #2c3e50;
        }
        #chartContentWrapper {
            flex: 1;
            min-height: 0;
            overflow: hidden;
            padding: 10px 15px;
        }
        #chartContentWrapper.hidden {
            display: none;
        }
        #chartAndDashboard {
            display: flex;
            gap: 20px;
            width: 100%;
            height: 100%;
        }
        #timeSeriesChart {
            flex: 1;
            min-width: 0;
            min-height: 0;
            height: 100%;
        }
        #dashboardContainer {
            flex: 1 1 42%;
            display: flex;
            flex-direction: column;
            padding-right: 10px;
            align-items: stretch;
        }
        #donutChart {
            width: 100%;
            height: 220px;
        }
        /* Modo donut: gráfico izquierda, tabla derecha */
        @media (min-width: 769px) {
            #dashboardContainer.donut-mode {
                flex-direction: row;
                align-items: stretch;
                gap: 12px;
            }
            #dashboardContainer.donut-mode #donutChart {
                flex: 0 0 44%;
                height: 100%;
                min-height: 0;
            }
            #dashboardContainer.donut-mode .alert-table {
                flex: 1;
                align-self: center;
                font-size: 12px;
            }
        }
        .alert-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 11px;
            margin-top: 4px;
        }
        .alert-table th {
            text-align: center;
            padding: 4px 6px;
            background: #f0f0f0;
            font-weight: 600;
            color: #555;
            border-bottom: 1px solid #ddd;
        }
        .alert-table th:first-child { text-align: left; }
        .alert-table td {
            padding: 4px 6px;
            text-align: center;
            border-bottom: 1px solid #f0f0f0;
        }
        .alert-table td:first-child { text-align: left; }
        .alert-table tr:last-child td {
            font-weight: 700;
            border-top: 1px solid #ccc;
            border-bottom: none;
        }
        .scorecard-subtitle {
            font-size: 10px;
            opacity: 0.8;
            margin-top: 4px;
            font-weight: 500;
        }
        #rightPanel {
            position: absolute;
            top: 0;
            right: 0;
            width: 280px;
            bottom: 0;
            background: white;
            border-left: 2px solid #ddd;
            padding: 15px;
            overflow-y: auto;
            z-index: 2;
        }
        .panel-title {
            font-size: 16px;
            font-weight: bold;
            background: #2c3e50;
            color: white;
            padding: 10px 12px;
            margin: -15px -15px 15px -15px;
            border-radius: 4px 4px 0 0;
            display: flex;
            align-items: center;
        }
        #panelTitleText { flex: 1; }
        .collapsible-section {
            margin-bottom: 20px;
        }
        .section-header {
            background: #34495e;
            color: white;
            padding: 10px;
            border-radius: 4px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: 600;
            user-select: none;
            font-size: 13px;
        }
        .section-header:hover {
            background: #2c3e50;
        }
        .section-content {
            background: #ecf0f1;
            padding: 10px;
            border-radius: 0 0 4px 4px;
            max-height: 500px;
            overflow-y: auto;
            transition: all 0.3s ease;
        }
        .section-content.hidden {
            max-height: 0;
            overflow: hidden;
            padding: 0;
        }
        .toggle-btn {
            font-size: 16px;
            cursor: pointer;
        }
        .legend-item {
            margin-bottom: 8px;
            font-size: 12px;
        }
        .legend-color {
            display: inline-block;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            margin-right: 6px;
            vertical-align: middle;
        }
        .checkbox-group {
            margin-bottom: 10px;
        }
        .checkbox-group label {
            display: flex;
            align-items: center;
            font-size: 13px;
            cursor: pointer;
        }
        .checkbox-group input {
            margin-right: 8px;
            cursor: pointer;
        }
        .layer-stats {
            font-size: 12px;
            margin-top: 8px;
            padding: 8px;
            background: white;
            border-radius: 4px;
            border-left: 3px solid #34495e;
        }
        .layer-stats .stats-date {
            font-size: 10px;
            color: #777;
        }
        /* Controles personalizados: geolocalizador y busqueda de sitios */
        .custom-ctrl a {
            font-size: 18px;
            font-weight: bold;
            line-height: 30px;
            text-align: center;
            display: block;
        }
        .site-search-ctrl {
            width: 260px;
            max-width: 72vw;
        }
        .ss-box {
            display: flex;
            background: #fff;
            border: 2px solid #34495e;
            border-radius: 6px;
            overflow: hidden;
            box-shadow: 0 1px 6px rgba(0,0,0,0.3);
        }
        .ss-box input {
            flex: 1;
            border: none;
            padding: 8px 10px;
            font-size: 15px;
            outline: none;
            min-width: 0;
        }
        .ss-box button {
            border: none;
            background: #34495e;
            color: #fff;
            cursor: pointer;
            padding: 0 12px;
            font-size: 16px;
        }
        .ss-box button:hover { background: #2c3e50; }
        .ss-results {
            margin-top: 4px;
            background: #fff;
            border-radius: 6px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.25);
            max-height: 260px;
            overflow-y: auto;
            display: none;
        }
        .ss-results .ss-header {
            background: #2c3e50;
            color: #fff;
            font-size: 13px;
            font-weight: 700;
            padding: 5px 10px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            position: sticky;
            top: 0;
        }
        .ss-item {
            padding: 7px 10px;
            font-size: 14px;
            cursor: pointer;
            border-bottom: 1px solid #eee;
            line-height: 1.3;
        }
        .ss-item:hover { background: #ecf0f1; }
        .ss-item .ss-sub { font-size: 13px; color: #666; }
        .ss-item .ss-badge {
            display: inline-block;
            font-size: 12px;
            font-weight: 700;
            color: #fff;
            border-radius: 3px;
            padding: 1px 6px;
            margin-right: 6px;
            vertical-align: middle;
        }
        .ss-empty { padding: 8px 10px; font-size: 14px; color: #888; }

        /* FAB (i) — solo en mobile, reemplazado por drawer tab */
        #mobileInfoBtn { display: none; }

        /* Pestaña lateral drawer — oculta en desktop */
        #mobileDrawerTab {
            display: none;
            position: fixed;
            top: 50%; right: 0;
            transform: translateY(-50%);
            width: 28px; height: 64px;
            background: #2c3e50;
            color: white;
            border: none;
            border-radius: 8px 0 0 8px;
            font-size: 18px;
            cursor: pointer;
            z-index: 21;
            align-items: center; justify-content: center;
            box-shadow: -2px 0 8px rgba(0,0,0,0.25);
            writing-mode: horizontal-tb;
        }

        /* Backdrop mobile — oculto en desktop */
        #mobileBackdrop {
            display: none;
            position: fixed; top: 0; left: 0; right: 80vw; bottom: 0;
            background: rgba(0,0,0,0.45);
            z-index: 19;
        }

        /* Handle (no usado en nueva versión) */
        .mobile-panel-handle { display: none; }

        /* ---- Panel colapsable + gráficos bajo demanda (solo desktop) ---- */
        @media (min-width: 769px) {
            #rightPanel { transition: width 0.3s ease; overflow: hidden; }
            body.panel-collapsed #rightPanel { width: 40px !important; padding: 0 !important; }
            body.panel-collapsed #rightPanel .collapsible-section,
            body.panel-collapsed #rightPanel .section-content,
            body.panel-collapsed #chartIconBar { display: none !important; }
            body.panel-collapsed #panelTitle {
                height: 100%; flex-direction: column;
                justify-content: flex-start; padding: 10px 0;
                border-radius: 0; margin: 0;
            }
            body.panel-collapsed #panelTitleText {
                writing-mode: vertical-rl; transform: rotate(180deg);
                margin-top: 12px; font-size: 12px;
            }
            body.panel-collapsed #panelCollapseBtn { margin-bottom: 4px; }
            #mapContainer { transition: right 0.3s ease, bottom 0.3s ease; }
            #chartContainer { transition: right 0.3s ease; }
            body.panel-collapsed #mapContainer { right: 40px; }
            body.panel-collapsed #chartContainer { right: 40px; }
            /* Gráfico oculto por defecto — se activa con íconos */
            #chartContainer { display: none; }
            #chartContainer.chart-visible { display: flex; }
            #mapContainer { bottom: 0 !important; }
            #mapContainer.chart-visible { bottom: 38% !important; }
            #panelCollapseBtn { display: block !important; }
        }
        /* Botón colapsar panel */
        #panelCollapseBtn {
            display: none;
            background: rgba(255,255,255,0.2); border: none; color: white;
            font-size: 15px; width: 26px; height: 26px; border-radius: 50%;
            cursor: pointer; line-height: 1; padding: 0; flex-shrink: 0;
        }
        #panelCollapseBtn:hover { background: rgba(255,255,255,0.35); }
        /* ── Leyenda: símbolos consistentes y grandes ── */
        .legend-item { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
        .legend-sym {
            width: 42px; height: 42px; flex-shrink: 0;
            display: flex; align-items: center; justify-content: center; position: relative;
        }
        .legend-dot { font-size: 36px; line-height: 1; }
        .legend-shadow-w { text-shadow: -1px -1px 0 #fff, 1px -1px 0 #fff, -1px 1px 0 #fff, 1px 1px 0 #fff; }
        .legend-shadow-d { text-shadow: -1px -1px 0 #555, 1px -1px 0 #555, -1px 1px 0 #555, 1px 1px 0 #555; }
        .legend-badge {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -32%);
            font-size: 13px; font-weight: 700; line-height: 1; pointer-events: none;
        }
        .legend-arrow { font-size: 34px; line-height: 1; display: inline-block; transform: scaleX(1.35) scaleY(0.85); }
        .legend-label { font-size: 14px; }
        @media (max-width: 768px) {
            .legend-sym { width: 40px; height: 40px; }
            .legend-dot { font-size: 32px; }
            .legend-arrow { font-size: 38px; }  /* flechas sin cambio */
            .legend-badge { font-size: 12px; }
            .legend-item { margin-bottom: 9px; gap: 12px; }
        }
        /* Barra de íconos de gráficos */
        #chartIconBar {
            display: flex; gap: 8px; justify-content: center;
            padding: 12px 10px; border-top: 1px solid #ddd;
            margin: 15px -15px -15px -15px; background: #f0f2f5;
        }
        .chart-icon-btn {
            display: flex; flex-direction: column; align-items: center;
            gap: 4px; padding: 8px 12px; min-width: 90px;
            background: #34495e; color: white;
            border: none; border-radius: 6px; cursor: pointer;
            font-size: 11px; font-weight: 600; transition: background 0.2s;
        }
        .chart-icon-btn:hover { background: #2c3e50; }
        .chart-icon-btn.active { background: #c0392b; }
        .chart-icon-btn .cib-icon { font-size: 20px; line-height: 1; }
    </style>
</head>
<body>
    <div class="container">
    <div id="mapContainer"></div>
    <div id="chartContainer">
        <div id="chartContainerHeader">
            <span id="chartTypeLabel"><b>Evolución de Alerta por punto</b></span>
            <div style="display:flex;align-items:center;gap:6px;">
                <span class="toggle-btn" onclick="toggleChartPanel()" style="cursor:pointer;" title="Minimizar">−</span>
                <button onclick="closeChartPanel()" style="background:rgba(255,255,255,0.2);border:none;color:white;font-size:15px;width:24px;height:24px;border-radius:50%;cursor:pointer;line-height:1;padding:0;" title="Cerrar">✕</button>
            </div>
        </div>
        <div id="chartContentWrapper">
            <div id="chartAndDashboard">
                <div id="timeSeriesChart"></div>
                <div id="dashboardContainer"></div>
            </div>
        </div>
    </div>
    <div id="rightPanel">
        <div class="mobile-panel-handle"></div>
        <div class="panel-title" id="panelTitle">
            <span id="panelTitleText">Alertas</span>
            <button id="mobileClosePanel" onclick="closeMobileInfo()" aria-label="Cerrar panel"
                style="display:none;background:rgba(255,255,255,0.2);border:none;color:white;font-size:18px;width:28px;height:28px;border-radius:50%;cursor:pointer;line-height:1;flex-shrink:0;">✕</button>
            <button id="panelCollapseBtn" onclick="toggleRightPanel()" title="Cerrar panel">✕</button>
        </div>

        <!-- Capas Activas -->
        <div class="collapsible-section">
            <div class="section-header" onclick="toggleSection(this)">
                <span>Capas activas</span>
                <span class="toggle-btn">+</span>
            </div>
            <div class="section-content hidden">
                <div class="checkbox-group">
                    <label>
                        <input type="checkbox" id="srh-toggle" checked onchange="updateMap()">
                        SRH
                    </label>
                </div>
                <div id="srh-stats" class="layer-stats">Puntos: 0</div>
                <div class="checkbox-group">
                    <label>
                        <input type="checkbox" id="ada-toggle" checked onchange="updateMap()">
                        ADA
                    </label>
                </div>
                <div id="ada-stats" class="layer-stats">Puntos: 0</div>
            </div>
        </div>

        <!-- Leyenda -->
        <div class="collapsible-section">
            <div class="section-header" onclick="toggleSection(this)">
                <span>Leyenda</span>
                <span class="toggle-btn">+</span>
            </div>
            <div class="section-content hidden">
                <div style="margin-bottom:8px;"><strong>Nivel de alerta</strong></div>
                <div class="legend-item">
                    <span class="legend-sym">
                        <span class="legend-dot legend-shadow-w" style="color:#28a745;">●</span>
                    </span>
                    <span class="legend-label">Alerta 1 (Verde)</span>
                </div>
                <div class="legend-item">
                    <span class="legend-sym">
                        <span class="legend-dot legend-shadow-d" style="color:#ffe600;">●</span>
                        <span class="legend-badge" style="color:#1a1a1a;">!</span>
                    </span>
                    <span class="legend-label">Alerta 2 (Amarillo)</span>
                </div>
                <div class="legend-item">
                    <span class="legend-sym">
                        <span class="legend-dot legend-shadow-w" style="color:#ff9800;">●</span>
                        <span class="legend-badge" style="color:#fff;">✕</span>
                    </span>
                    <span class="legend-label">Alerta 3 (Naranja)</span>
                </div>
                <div class="legend-item">
                    <span class="legend-sym">
                        <span class="legend-dot legend-shadow-w" style="color:#dc3545;">●</span>
                        <span class="legend-badge" style="color:#fff;">✕</span>
                    </span>
                    <span class="legend-label">Alerta 4 (Rojo)</span>
                </div>
                <div style="margin-top:12px;margin-bottom:8px;"><strong>Tendencias</strong></div>
                <div class="legend-item">
                    <span class="legend-sym">
                        <span class="legend-dot legend-shadow-w" style="color:#555;">●</span>
                    </span>
                    <span class="legend-label">Estable</span>
                </div>
                <div class="legend-item">
                    <span class="legend-sym">
                        <span class="legend-arrow">⬆</span>
                    </span>
                    <span class="legend-label">En aumento</span>
                </div>
                <div class="legend-item">
                    <span class="legend-sym">
                        <span class="legend-arrow">⬇</span>
                    </span>
                    <span class="legend-label">En disminución</span>
                </div>
            </div>
        </div>
        <!-- Íconos para abrir gráficos -->
        <div id="chartIconBar">
            <button class="chart-icon-btn" id="btnPopups" onclick="togglePopups()" title="Mostrar info de puntos">
                <span class="cib-icon">💬</span>
                <span>Info</span>
            </button>
            <button class="chart-icon-btn" id="btnChartDonut" onclick="showChartPanel('donut')" title="Distribución de alertas">
                <span class="cib-icon">📊</span>
                <span>Distribución</span>
            </button>
            <button class="chart-icon-btn" id="btnChartSeries" onclick="showChartPanel('series')" title="Evolución temporal">
                <span class="cib-icon">📈</span>
                <span>Evolución</span>
            </button>
        </div>
    </div>
    </div>

    <!-- Mobile: backdrop y pestaña lateral -->
    <div id="mobileBackdrop" onclick="closeMobileInfo()"></div>
    <button id="mobileInfoBtn" style="display:none"></button>
    <button id="mobileDrawerTab" onclick="toggleMobileInfo()" aria-label="Capas y leyenda">‹</button>

    <script>
        // Initialize map
        const map = L.map('mapContainer').setView([-36.423795, -60.490621], 6);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap contributors',
            maxZoom: 19
        }).addTo(map);

        // ---- Geolocalizador ----
        const geoCtrl = L.control({ position: 'topleft' });
        geoCtrl.onAdd = function () {
            const c = L.DomUtil.create('div', 'leaflet-bar custom-ctrl');
            c.innerHTML = '<a href="#" title="Ir a mi ubicación" role="button">&#128205;</a>';
            L.DomEvent.disableClickPropagation(c);
            L.DomEvent.on(c.querySelector('a'), 'click', function (e) {
                L.DomEvent.stop(e);
                if (window._nativeLocation) {
                    map.setView(window._nativeLocation, 14);
                } else {
                    map.locate({ setView: true, maxZoom: 14, enableHighAccuracy: true });
                }
            });
            return c;
        };
        geoCtrl.addTo(map);

        let userMarker = null;
        let userCircle = null;

        function showUserLocation(latlng, accuracy) {
            if (userMarker) map.removeLayer(userMarker);
            if (userCircle) map.removeLayer(userCircle);
            userCircle = L.circle(latlng, {
                radius: accuracy,
                color: '#2c3e50', fillColor: '#3498db', fillOpacity: 0.15, weight: 1
            }).addTo(map);
            userMarker = L.marker(latlng, {
                icon: L.divIcon({
                    html: '<div style="font-size:26px; line-height:26px; text-shadow:0 0 3px #fff;">&#128205;</div>',
                    iconSize: [26, 26], iconAnchor: [13, 26], className: ''
                })
            }).addTo(map).bindPopup('Estás aquí (&plusmn;' + Math.round(accuracy) + ' m)').openPopup();
        }

        // Llamada desde app nativa (Kodular): Web_Viewer1.EvaluateJS "setUserLocation(lat,lng)"
        window.setUserLocation = function(lat, lng) {
            lat = parseFloat(lat); lng = parseFloat(lng);
            if (!lat || !lng) return;
            const latlng = L.latLng(lat, lng);
            window._nativeLocation = latlng;
            showUserLocation(latlng, 50);
            map.setView(latlng, 14);
        };

        map.on('locationfound', function (e) {
            showUserLocation(e.latlng, e.accuracy);
        });

        map.on('locationerror', function (e) {
            alert('No se pudo obtener tu ubicación.\n' + e.message +
                  '\n\n(La geolocalización requiere permiso del navegador y, en general, conexión segura HTTPS.)');
        });

        // ---- Búsqueda de sitios (capas propias + lugares OSM) ----
        const searchCtrl = L.control({ position: 'topright' });
        searchCtrl.onAdd = function () {
            const c = L.DomUtil.create('div', 'site-search-ctrl');
            c.innerHTML =
                '<div class="ss-box">' +
                '  <input id="siteSearchInput" type="text" placeholder="Buscar por código, nombre o lugar..." autocomplete="off">' +
                '  <button id="siteSearchBtn" title="Buscar en OSM">&#128269;</button>' +
                '</div>' +
                '<div id="siteSearchResults" class="ss-results"></div>';
            L.DomEvent.disableClickPropagation(c);
            L.DomEvent.disableScrollPropagation(c);
            return c;
        };
        searchCtrl.addTo(map);

        const searchIndex = [];
        let osmSearchTimer = null;
        let osmResultMarker = null;

        document.getElementById('siteSearchInput').addEventListener('input', onSearchInput);
        document.getElementById('siteSearchInput').addEventListener('keydown', function (e) {
            if (e.key === 'Enter') { e.preventDefault(); runOsmSearch(this.value.trim()); }
        });
        document.getElementById('siteSearchBtn').addEventListener('click', function () {
            runOsmSearch(document.getElementById('siteSearchInput').value.trim());
        });

        function onSearchInput() {
            const q = document.getElementById('siteSearchInput').value.trim();
            if (!q) { hideResults(); return; }
            const local = searchLocal(q);
            renderResults(local, null);
            clearTimeout(osmSearchTimer);
            osmSearchTimer = setTimeout(function () { runOsmSearch(q, local); }, 450);
        }

        function searchLocal(q) {
            const ql = q.toLowerCase();
            return searchIndex.filter(function (s) { return s.search.indexOf(ql) !== -1; }).slice(0, 8);
        }

        function runOsmSearch(q, localCached) {
            if (!q) return;
            const local = localCached || searchLocal(q);
            const url = 'https://nominatim.openstreetmap.org/search?format=json&limit=5&countrycodes=ar&q=' +
                        encodeURIComponent(q);
            fetch(url, { headers: { 'Accept-Language': 'es' } })
                .then(function (r) { return r.json(); })
                .then(function (osm) { renderResults(local, osm); })
                .catch(function () { renderResults(local, []); });
        }

        function renderResults(local, osm) {
            const box = document.getElementById('siteSearchResults');
            let html = '';
            const badgeColors = { SRH: '#2980b9', ADA: '#16a085' };

            if (local && local.length) {
                html += '<div class="ss-header">Puntos monitoreados</div>';
                local.forEach(function (s, i) {
                    html += '<div class="ss-item" data-type="local" data-idx="' + i + '">' +
                            '<span class="ss-badge" style="background:' + badgeColors[s.layerName] + '">' + s.layerLabel + '</span>' +
                            s.code + (s.name && s.name !== s.code ? ' — ' + s.name : '') +
                            (s.sub ? '<div class="ss-sub">' + s.sub + '</div>' : '') +
                            '</div>';
                });
            }

            if (osm) {
                if (osm.length) {
                    html += '<div class="ss-header">Lugares (OSM)</div>';
                    osm.forEach(function (o, i) {
                        html += '<div class="ss-item" data-type="osm" data-idx="' + i + '">' +
                                '<span class="ss-badge" style="background:#7f8c8d">OSM</span>' +
                                o.display_name +
                                '</div>';
                    });
                } else if (!local || !local.length) {
                    html += '<div class="ss-empty">Sin resultados.</div>';
                }
            } else if (!local || !local.length) {
                html += '<div class="ss-empty">Escribí para buscar...</div>';
            }

            box.innerHTML = html;
            box.style.display = 'block';
            box._local = local || [];
            box._osm = osm || [];

            box.querySelectorAll('.ss-item').forEach(function (el) {
                el.addEventListener('click', function () {
                    const idx = parseInt(el.getAttribute('data-idx'), 10);
                    if (el.getAttribute('data-type') === 'local') {
                        goToLocal(box._local[idx]);
                    } else {
                        goToOsm(box._osm[idx]);
                    }
                    hideResults();
                });
            });
        }

        function hideResults() {
            const box = document.getElementById('siteSearchResults');
            box.style.display = 'none';
            box.innerHTML = '';
        }

        function goToLocal(s) {
            if (!s) return;
            const toggle = document.getElementById(layerToggles[s.layerName]);
            if (toggle && !toggle.checked) { toggle.checked = true; updateMap(); }
            map.flyTo(s.latlng, 13, { duration: 0.8 });
            map.once('moveend', function () { s.marker.fire('click'); });
        }

        function goToOsm(o) {
            if (!o) return;
            const latlng = [parseFloat(o.lat), parseFloat(o.lon)];
            if (osmResultMarker) map.removeLayer(osmResultMarker);
            map.flyTo(latlng, 13, { duration: 0.8 });
            osmResultMarker = L.marker(latlng).addTo(map)
                .bindPopup('<b>' + o.display_name + '</b>').openPopup();
        }

        const layerNames = ['SRH', 'ADA'];
        const layerDisplayNames = { SRH: 'SRH', ADA: 'ADA' };
        const layerToggles = { SRH: 'srh-toggle', ADA: 'ada-toggle' };
        const layerStats = { SRH: 'srh-stats', ADA: 'ada-stats' };

        // Configuracion de campos por capa (segun los geojson reales)
        const layerConfig = {
            SRH: {
                pointNameField: 'PUNTO',
                idField: 'PUNTO',
                nameField: 'NOMBRE CON',
                popupFields: [
                    { key: 'NOMBRE CON', label: 'Nombre' },
                    { key: 'MUNICIPIO', label: 'Municipio' },
                    { key: 'info', label: 'Info' },
                    { key: 'Acciones', label: 'Acciones' }
                ]
            },
            ADA: {
                pointNameField: 'Nombre',
                idField: 'CodPunto',
                nameField: 'Nombre',
                popupFields: [
                    { key: 'CodPunto', label: 'CodPunto' },
                    { key: 'Municipio', label: 'Municipio' },
                    { key: 'Laguna Rio', label: 'Laguna/Río' },
                    { key: 'info', label: 'Info' },
                    { key: 'Acciones', label: 'Acciones' }
                ]
            }
        };
        const notesFields = ['S2 Fecha', 'S3 Fecha'];

        // Color mapping for alerts
        const alertColors = {
            1: '#28a745',
            2: '#ffe600',
            3: '#ff9800',
            4: '#dc3545'
        };

        let geoJsonLayers = {};           // capa visible en el mapa (fecha mas reciente por capa)
        const historicalData = { SRH: {}, ADA: {} }; // fecha -> [{id,alerta}] por punto, para la serie temporal
        const latestDateByLayer = {};
        let selectedPoint = null;         // { layerName, id, name } - punto elegido en el mapa
        let highlightMarker = null;       // resalta el punto seleccionado en el mapa

        function formatDate(yyyymmdd) {
            if (!yyyymmdd || yyyymmdd.length !== 8) return yyyymmdd || '-';
            return `${yyyymmdd.slice(6, 8)}/${yyyymmdd.slice(4, 6)}/${yyyymmdd.slice(0, 4)}`;
        }

        function toISODate(yyyymmdd) {
            if (!yyyymmdd || yyyymmdd.length !== 8) return yyyymmdd;
            return `${yyyymmdd.slice(0,4)}-${yyyymmdd.slice(4,6)}-${yyyymmdd.slice(6,8)}`;
        }

        function hasValue(v) {
            return v !== null && v !== undefined && v !== '';
        }

        function getSymbol(dif) {
            if (dif === 1) return '⬆';
            if (dif === -1) return '⬇';
            return '●';
        }

        function getAlertBadge(alerta) {
            if (alerta === 2) return '!';
            if (alerta === 3 || alerta === 4) return '✕';
            return '';
        }

        function createMarker(feature, latlng, layerName) {
            const props = feature.properties;
            const alerta = props.Alerta || 1;
            const dif = props.Dif || 0;
            const color = alertColors[alerta] || alertColors[1];
            const symbol = getSymbol(dif);
            const isCircle = dif === 0;
            const config = layerConfig[layerName];

            // Bordes: gris oscuro para amarillo, blanco para el resto
            const borderColor = (alerta === 2) ? '#555' : 'white';
            const textShadow = `-1px -1px 0 ${borderColor}, 1px -1px 0 ${borderColor}, -1px 1px 0 ${borderColor}, 1px 1px 0 ${borderColor}`;

            // Badge solo en círculos (●), no en flechas
            const badge = isCircle ? getAlertBadge(alerta) : '';
            const badgeColor = (alerta === 2) ? '#1a1a1a' : 'white';
            // En celular los círculos se ven más chicos; las flechas quedan igual
            const isMob = window.matchMedia('(max-width: 768px)').matches;
            const fontSize = isCircle ? (isMob ? '23px' : '30px') : '28px';
            const badgeFont = (isCircle && isMob) ? '8px' : '10px';
            const iconDim = (isCircle && isMob) ? 26 : 32;
            const badgeHtml = badge
                ? `<span style="position:absolute;top:50%;left:50%;transform:translate(-50%,-25%);color:${badgeColor};font-size:${badgeFont};font-weight:700;line-height:1;pointer-events:none;">${badge}</span>`
                : '';

            const arrowTransform = !isCircle ? 'display:inline-block;transform:scaleX(1.4) scaleY(0.7);' : '';
            const html = `<div style="position:relative;width:${iconDim}px;height:${iconDim}px;display:flex;align-items:center;justify-content:center;cursor:pointer;overflow:visible;"><span style="font-size:${fontSize};color:${color};text-shadow:${textShadow};${arrowTransform}">${symbol}</span>${badgeHtml}</div>`;

            const marker = L.marker(latlng, {
                icon: L.divIcon({ html: html, iconSize: [iconDim, iconDim], className: '' })
            });

            const layerLabel = layerDisplayNames[layerName];
            const pointName = props[config.pointNameField] || '-';

            const _isMob = window.matchMedia('(max-width: 768px)').matches;
            const popupBase = _isMob ? '15px' : '13px';
            const popupWidth = _isMob ? '220px' : '190px';
            let popupContent = `
                <div style="font-size: ${popupBase}; min-width: ${popupWidth};">
                    <div style="
                        text-align: center;
                        font-size: 18px;
                        font-weight: 800;
                        letter-spacing: 2px;
                        color: #2c3e50;
                        background: #ecf0f1;
                        border-radius: 6px 6px 0 0;
                        padding: 6px 10px 2px;
                        margin-bottom: 2px;
                        text-transform: uppercase;
                    ">${layerLabel}</div>
                    <div style="
                        text-align: center;
                        font-size: 15px;
                        font-weight: 700;
                        color: #1a5276;
                        background: #e8f4fc;
                        border-radius: 0;
                        padding: 4px 10px 8px;
                        margin-bottom: 8px;
                        border-bottom: 2px solid #e0e0e0;
                    ">${pointName}</div>
            `;

            config.popupFields.forEach(({ key, label }) => {
                if (key === config.pointNameField) return;

                let value = hasValue(props[key]) ? props[key] : '-';

                if (key === 'info' && value !== '-') {
                    const alertStyles = {
                        'alerta verde':    { bg: '#1e7e34', color: '#ffffff' },
                        'alerta amarillo': { bg: '#d4a017', color: '#ffffff' },
                        'alerta naranja':  { bg: '#d35400', color: '#ffffff' },
                        'alerta roja':     { bg: '#c0392b', color: '#ffffff' }
                    };
                    const commaIdx = value.indexOf(',');
                    let prefix = commaIdx !== -1 ? value.substring(0, commaIdx) : value;
                    let rest   = commaIdx !== -1 ? value.substring(commaIdx) : '';
                    const prefixLower = prefix.toLowerCase().trim();
                    let matched = null;
                    for (const k of Object.keys(alertStyles)) {
                        if (prefixLower.includes(k)) { matched = k; break; }
                    }
                    if (matched) {
                        const s = alertStyles[matched];
                        value = `<span style="display:inline-block;background:${s.bg};color:${s.color};font-weight:700;padding:1px 7px;border-radius:4px;border:1px solid rgba(0,0,0,0.15);">${prefix}</span>${rest}`;
                    }
                }

                const fontSize = key === 'Acciones' ? 'font-size: 14px;' : '';
                popupContent += `<div style="padding: 2px 4px; ${fontSize}"><strong>${label}:</strong> ${value}</div>`;
            });

            // Notas chicas: S2 Fecha / S3 Fecha, solo si tienen datos
            const notes = notesFields
                .filter(f => hasValue(props[f]))
                .map(f => `${f}: ${props[f]}`);
            if (notes.length) {
                popupContent += `<div style="padding: 4px 4px 0; margin-top: 4px; border-top: 1px solid #e0e0e0; font-size: 10px; color: #888;">${notes.join(' &nbsp;|&nbsp; ')}</div>`;
            }

            popupContent += '</div>';
            const _popup = L.popup({ maxWidth: 320 }).setContent(popupContent);

            const idValue = props[config.idField];
            marker.on('click', () => {
                selectPoint(layerName, idValue, pointName, latlng);
                if (window._popupsEnabled) _popup.setLatLng(latlng).openOn(map);
            });

            searchIndex.push({
                marker: marker,
                layerName: layerName,
                layerLabel: layerLabel,
                code: idValue || '-',
                name: props[config.nameField] || '',
                sub: props.Municipio || props.MUNICIPIO || '',
                latlng: latlng,
                search: (idValue + ' ' + (props[config.nameField] || '') + ' ' + (props.Municipio || props.MUNICIPIO || '') + ' ' + layerLabel).toLowerCase()
            });

            return marker;
        }

        function selectPoint(layerName, id, name, latlng) {
            const isSameSelection = selectedPoint && selectedPoint.layerName === layerName && selectedPoint.id === id;
            selectedPoint = isSameSelection ? null : { layerName, id, name };

            if (highlightMarker) {
                map.removeLayer(highlightMarker);
                highlightMarker = null;
            }
            if (selectedPoint) {
                highlightMarker = L.circleMarker(latlng, {
                    radius: 14,
                    color: '#1a73e8',
                    weight: 3,
                    fill: false,
                    dashArray: '4,3'
                }).addTo(map);
            }

            updateTimeSeries();
        }

        function loadDate(layerName, date) {
            const fileName = `data/CianoAlert_${layerName}_${date}.geojson`;
            return fetch(fileName)
                .then(res => res.json())
                .then(data => {
                    const idField = layerConfig[layerName].idField;
                    const points = [];
                    data.features.forEach(feature => {
                        if (feature.geometry && feature.geometry.coordinates) {
                            points.push({
                                id: feature.properties[idField],
                                alerta: feature.properties.Alerta || 1
                            });
                        }
                    });
                    historicalData[layerName][date] = points;

                    if (date === latestDateByLayer[layerName]) {
                        const featureGroup = L.featureGroup();
                        data.features.forEach(feature => {
                            if (feature.geometry && feature.geometry.coordinates) {
                                const marker = createMarker(feature,
                                    [feature.geometry.coordinates[1], feature.geometry.coordinates[0]],
                                    layerName);
                                featureGroup.addLayer(marker);
                            }
                        });
                        geoJsonLayers[layerName] = { data: data, featureGroup: featureGroup };
                        featureGroup.addTo(map);

                        document.getElementById(layerStats[layerName]).innerHTML =
                            `Puntos: ${data.features.length}<br><span class="stats-date">Fecha: ${formatDate(date)}</span>`;
                    }
                })
                .catch(err => {
                    console.warn(`No se pudo cargar ${fileName}:`, err);
                    if (date === latestDateByLayer[layerName]) {
                        document.getElementById(layerStats[layerName]).innerHTML = `Puntos: 0 (archivo no encontrado)`;
                    }
                });
        }

        function updateMap() {
            layerNames.forEach(layerName => {
                if (!geoJsonLayers[layerName]) return;
                const isVisible = document.getElementById(layerToggles[layerName]).checked;
                if (isVisible) {
                    map.addLayer(geoJsonLayers[layerName].featureGroup);
                } else {
                    map.removeLayer(geoJsonLayers[layerName].featureGroup);
                }
            });
            updateDashboard();
        }

        function getVisibleFeatures() {
            const visibleFeatures = [];
            const bounds = map.getBounds();

            layerNames.forEach(layerName => {
                if (!document.getElementById(layerToggles[layerName]).checked) return;
                if (!geoJsonLayers[layerName]) return;

                geoJsonLayers[layerName].data.features.forEach(feature => {
                    if (feature.geometry && feature.geometry.coordinates) {
                        const lat = feature.geometry.coordinates[1];
                        const lng = feature.geometry.coordinates[0];
                        if (bounds.contains(L.latLng(lat, lng))) {
                            visibleFeatures.push({ feature: feature, layer: layerName });
                        }
                    }
                });
            });
            return visibleFeatures;
        }

        function updateDashboard() {
            const visibleFeatures = getVisibleFeatures();
            const total = visibleFeatures.length;

            const alertCounts = {
                1: { stable: 0, increase: 0, decrease: 0, total: 0 },
                2: { stable: 0, increase: 0, decrease: 0, total: 0 },
                3: { stable: 0, increase: 0, decrease: 0, total: 0 },
                4: { stable: 0, increase: 0, decrease: 0, total: 0 }
            };

            visibleFeatures.forEach(({ feature }) => {
                const alerta = feature.properties.Alerta || 1;
                const dif = feature.properties.Dif || 0;

                alertCounts[alerta].total++;
                if (dif === 0) alertCounts[alerta].stable++;
                if (dif === 1) alertCounts[alerta].increase++;
                if (dif === -1) alertCounts[alerta].decrease++;
            });

            const pct = (n) => total > 0 ? Math.round((n / total) * 100) : 0;
            const levelColors = { 1: '#28a745', 2: '#ffe600', 3: '#ff9800', 4: '#dc3545' };
            const levelNames  = { 1: 'Verde', 2: 'Amarillo', 3: 'Naranja', 4: 'Rojo' };

            const tableRows = [4, 3, 2, 1].map(lv => {
                const c = alertCounts[lv];
                const dot = `<span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:${levelColors[lv]};vertical-align:middle;margin-right:5px;"></span>`;
                return `<tr>
                    <td>${dot}Alerta ${lv} (${levelNames[lv]})</td>
                    <td>${c.total}</td>
                    <td>${pct(c.total)}%</td>
                    <td>${c.stable}</td>
                    <td>${c.increase}</td>
                    <td>${c.decrease}</td>
                </tr>`;
            }).join('');

            document.getElementById('dashboardContainer').innerHTML = `
                <div id="donutChart"></div>
                <table class="alert-table">
                    <thead><tr><th>Nivel</th><th>N</th><th>%</th><th>Est</th><th>⬆</th><th>⬇</th></tr></thead>
                    <tbody>
                        ${tableRows}
                        <tr><td><strong>Total</strong></td><td><strong>${total}</strong></td><td><strong>100%</strong></td><td colspan="3"></td></tr>
                    </tbody>
                </table>`;

            Plotly.newPlot('donutChart', [{
                type: 'pie',
                hole: 0.55,
                values: [alertCounts[4].total, alertCounts[3].total, alertCounts[2].total, alertCounts[1].total],
                labels: ['Alerta 4 (Rojo)', 'Alerta 3 (Naranja)', 'Alerta 2 (Amarillo)', 'Alerta 1 (Verde)'],
                marker: { colors: ['#dc3545', '#ff9800', '#ffe600', '#28a745'], line: { color: 'white', width: 2 } },
                textinfo: 'percent',
                textfont: { size: 11 },
                hovertemplate: '<b>%{label}</b><br>%{value} puntos (%{percent})<extra></extra>',
                direction: 'clockwise',
                sort: false
            }], {
                showlegend: false,
                margin: { l: 5, r: 5, t: 5, b: 5 },
                annotations: [{ text: `<b>${total}</b><br>puntos`, x: 0.5, y: 0.5, font: { size: 13, color: '#333' }, showarrow: false }],
                paper_bgcolor: 'rgba(0,0,0,0)',
                plot_bgcolor: 'rgba(0,0,0,0)'
            }, { responsive: true, displayModeBar: false });
        }

        function getPointHistory() {
            const { layerName, id } = selectedPoint;
            const dates = Object.keys(historicalData[layerName] || {}).sort();

            const xDates = [];
            const alertas = [];
            dates.forEach(date => {
                const found = (historicalData[layerName][date] || []).find(p => p.id === id);
                if (found) {
                    xDates.push(date);
                    alertas.push(found.alerta);
                }
            });

            return { xDates, alertas };
        }

        function updateTimeSeries() {
            const container = document.getElementById('timeSeriesChart');

            // Desktop: no hacer nada si el panel de Evolución no está abierto
            if (!window.matchMedia('(max-width: 768px)').matches &&
                !document.getElementById('btnChartSeries').classList.contains('active')) {
                return;
            }

            if (!selectedPoint) {
                Plotly.purge(container);
                container.innerHTML = `<div style="display:flex;align-items:center;justify-content:center;height:100%;color:#888;font-size:13px;text-align:center;padding:0 20px;">
                    Hacé clic en un punto del mapa para ver la evolución de su nivel de Alerta en el tiempo.
                </div>`;
                return;
            }
            container.innerHTML = '';

            const { xDates, alertas } = getPointHistory();
            const xIsoDates = xDates.map(toISODate);
            const markerColors = alertas.map(a => alertColors[a] || '#999');

            const bands = [1, 2, 3, 4].map(level => ({
                type: 'rect',
                xref: 'paper', x0: 0, x1: 1,
                yref: 'y', y0: level - 0.5, y1: level + 0.5,
                fillcolor: alertColors[level],
                opacity: 0.32,
                line: { width: 0 },
                layer: 'below'
            }));

            const trace = {
                x: xIsoDates,
                y: alertas,
                mode: 'lines+markers',
                line: { color: '#34495e', width: 2 },
                marker: { color: markerColors, size: 10, line: { color: '#34495e', width: 1 } },
                hovertemplate: '<b>%{x|%d/%m/%Y}</b><br>Alerta %{y}<extra></extra>',
                name: selectedPoint.name
            };

            const layout = {
                title: { text: `${selectedPoint.name} (${layerDisplayNames[selectedPoint.layerName]})`, font: { size: 13 } },
                shapes: bands,
                showlegend: false,
                margin: { l: 80, r: 15, t: 22, b: 45 },
                font: { size: 11 },
                paper_bgcolor: 'rgba(0,0,0,0)',
                plot_bgcolor: 'rgba(0,0,0,0)',
                xaxis: {
                    type: 'date',
                    tickformat: '%d/%m/%Y',
                    tickangle: -40,
                    showgrid: true,
                    gridcolor: '#e8e8e8',
                    tickfont: { size: 10 }
                },
                yaxis: {
                    title: 'Nivel de Alerta',
                    tickvals: [1, 2, 3, 4],
                    ticktext: ['1 - Verde', '2 - Amarillo', '3 - Naranja', '4 - Rojo'],
                    range: [0.5, 4.5],
                    showgrid: false
                }
            };

            Plotly.newPlot(container, [trace], layout, { responsive: true, displayModeBar: false });
        }

        function toggleMobileInfo() {
            const panel = document.getElementById('rightPanel');
            const backdrop = document.getElementById('mobileBackdrop');
            const tab = document.getElementById('mobileDrawerTab');
            const isOpen = panel.classList.contains('mobile-open');
            panel.classList.toggle('mobile-open', !isOpen);
            backdrop.classList.toggle('open', !isOpen);
            tab.classList.toggle('drawer-open', !isOpen);
            tab.textContent = isOpen ? '‹' : '›';
        }

        function closeMobileInfo() {
            document.getElementById('rightPanel').classList.remove('mobile-open');
            document.getElementById('mobileBackdrop').classList.remove('open');
            const tab = document.getElementById('mobileDrawerTab');
            tab.classList.remove('drawer-open');
            tab.textContent = '‹';
        }

        function toggleSection(header) {
            const content = header.nextElementSibling;
            const toggle = header.querySelector('.toggle-btn');
            content.classList.toggle('hidden');
            toggle.textContent = content.classList.contains('hidden') ? '+' : '−';
        }

        function toggleChartPanel() {
            const toggle = document.querySelector('#chartContainerHeader .toggle-btn');
            const container = document.getElementById('chartContainer');
            if (!window.matchMedia('(max-width: 768px)').matches) return;
            const minimized = container.classList.toggle('mobile-minimized');
            toggle.textContent = minimized ? '+' : '−';
            setTimeout(() => map.invalidateSize(), 320);
        }

        window._popupsEnabled = false;

        function togglePopups() {
            window._popupsEnabled = !window._popupsEnabled;
            const btn = document.getElementById('btnPopups');
            btn.classList.toggle('active', window._popupsEnabled);
            if (!window._popupsEnabled) map.closePopup();
        }

        function toggleRightPanel() {
            const collapsed = document.body.classList.toggle('panel-collapsed');
            document.getElementById('panelCollapseBtn').textContent = collapsed ? '›' : '✕';
            setTimeout(() => map.invalidateSize(), 320);
        }

        function showChartPanel(type) {
            const btnDonut = document.getElementById('btnChartDonut');
            const btnSeries = document.getElementById('btnChartSeries');
            // Segundo clic en el mismo botón → cerrar
            const alreadyActive = (type === 'donut' && btnDonut.classList.contains('active')) ||
                                   (type === 'series' && btnSeries.classList.contains('active'));
            if (alreadyActive) { closeChartPanel(); return; }

            const container = document.getElementById('chartContainer');
            const mapC = document.getElementById('mapContainer');
            const timeSeries = document.getElementById('timeSeriesChart');
            const dashboard = document.getElementById('dashboardContainer');

            if (type === 'donut') {
                document.getElementById('chartTypeLabel').innerHTML = '<b>Distribución de Alertas</b>';
                timeSeries.style.display = 'none';
                dashboard.style.display = '';
                dashboard.classList.add('donut-mode');
                btnDonut.classList.add('active');
                btnSeries.classList.remove('active');
            } else {
                document.getElementById('chartTypeLabel').innerHTML = '<b>Evolución de Alerta por punto</b>';
                timeSeries.style.display = '';
                dashboard.style.display = 'none';
                dashboard.classList.remove('donut-mode');
                btnSeries.classList.add('active');
                btnDonut.classList.remove('active');
            }

            const isMob = window.matchMedia('(max-width: 768px)').matches;
            if (isMob) {
                container.classList.add('mobile-open');
                container.classList.remove('mobile-minimized');
            } else {
                container.classList.add('chart-visible');
                mapC.classList.add('chart-visible');
            }
            setTimeout(() => {
                map.invalidateSize();
                if (type === 'series') updateTimeSeries();
                else Plotly.Plots.resize('donutChart');
            }, 320);
        }

        function closeChartPanel() {
            const isMob = window.matchMedia('(max-width: 768px)').matches;
            const container = document.getElementById('chartContainer');
            if (isMob) {
                container.classList.remove('mobile-open');
            } else {
                container.classList.remove('chart-visible');
                document.getElementById('mapContainer').classList.remove('chart-visible');
            }
            document.getElementById('btnChartDonut').classList.remove('active');
            document.getElementById('btnChartSeries').classList.remove('active');
            setTimeout(() => map.invalidateSize(), 320);
        }

        // Carga inicial: manifest.json -> todas las fechas historicas + capa mas reciente en el mapa
        fetch('manifest.json')
            .then(res => res.json())
            .then(manifest => {
                const layerDates = { SRH: manifest.srh || [], ADA: manifest.ada || [] };
                layerNames.forEach(l => {
                    latestDateByLayer[l] = layerDates[l].length ? layerDates[l][layerDates[l].length - 1] : null;
                });

                const fetches = [];
                layerNames.forEach(l => {
                    layerDates[l].forEach(date => fetches.push(loadDate(l, date)));
                });

                return Promise.all(fetches);
            })
            .then(() => {
                const maxDate = [latestDateByLayer.SRH, latestDateByLayer.ADA]
                    .filter(Boolean).sort().pop();
                document.getElementById('panelTitleText').textContent = maxDate
                    ? `Alertas: ${formatDate(maxDate)}`
                    : 'Alertas';

                updateDashboard();
                updateTimeSeries();

                map.on('zoomend', updateDashboard);
                map.on('moveend', updateDashboard);
            })
            .catch(err => console.error('Error cargando manifest.json:', err));

        // Resize handler for responsive
        window.addEventListener('resize', () => {
            setTimeout(() => {
                map.invalidateSize();
            }, 100);
        });
    </script>
</body>
</html>
